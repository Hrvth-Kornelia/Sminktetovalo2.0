<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"

    >

    <meta name="theme-color" content="#f8f4ef">

    <title>Luxória Beauty Art – Portfólió</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Montserrat:wght@400;500;600&display=swap"

    <!-- Saját CSS -->

<body>

    <!-- FEJLÉC -->

    <header class="luxoria-header">

        <a

            href="index.html"

        >

        <a
            class="brand"
            href="#"
            aria-label="Luxória Beauty Art"
        >

            <span class="brand-name">
                LUXÓRIA

            <span class="brand-subtitle">
                BEAUTY ART

        </a>

    <!-- PORTFÓLIÓ -->

    <main class="portfolio">

        <article class="portfolio-card portfolio-card--brows">

                <h1>
                    Finom.<br>
                    Természetes.<br>
                    Tökéletes.

                    <span>

                    </span>

                    <span class="details-line"></span>

                </a>

            </div>

        </article>


        <!-- AJAK -->

        <article class="portfolio-card portfolio-card--lips">

            <div class="portfolio-copy">

                <p class="eyebrow">
                    LIP BLUSH TATTOO
                </p>

                <h2>
                    Ajak<br>
                    Tetoválás.
                </h2>

                <a href="#" class="details-link">

                    <span>
                        Részletek megtekintése
                    </span>

                    <span class="details-line"></span>

                </a>

            </div>

        </article>


        <!-- SZEMHÉJ -->

        <article class="portfolio-card portfolio-card--liner">

            <div class="portfolio-copy">

                <p class="eyebrow">
                    EYELINER TATTOO
                </p>

                <h2>
                    Szemhéj<br>
                    Tetoválás.
                </h2>

                <a href="#" class="details-link">

                    <span>
                        Részletek megtekintése
                    </span>
